<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Công cụ Mô Phỏng Lãi Kép</title>
    <!-- Nhúng thư viện Chart.js từ mạng (CDN) để vẽ biểu đồ -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        /* CSS: Làm đẹp cho giao diện */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            max-width: 800px;
            width: 100%;
        }
        h2 { text-align: center; color: #2c3e50; }
        .control-group {
            margin-bottom: 20px;
        }
        .control-group label {
            display: flex;
            justify-content: space-between;
            font-weight: bold;
            margin-bottom: 8px;
        }
        /* Style cho thanh trượt (slider) */
        input[type=range] {
            width: 100%;
            cursor: pointer;
        }
        .result-box {
            background: #eafaf1;
            border: 1px solid #2ecc71;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
            margin: 20px 0;
        }
        .result-box h3 { margin: 0; font-size: 24px; color: #27ae60; }
        .chart-container {
            position: relative;
            height: 400px;
            width: 100%;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Mô Phỏng Lãi Kép & Đầu Tư</h2>
    
    <!-- Các thanh trượt điều chỉnh thông số -->
    <div class="control-group">
        <label>Vốn ban đầu: <span id="valPrincipal">100,000,000 ₫</span></label>
        <input type="range" id="inputPrincipal" min="0" max="1000000000" step="10000000" value="100000000">
    </div>

    <div class="control-group">
        <label>Góp thêm mỗi tháng: <span id="valMonthly">5,000,000 ₫</span></label>
        <input type="range" id="inputMonthly" min="0" max="50000000" step="1000000" value="5000000">
    </div>

    <div class="control-group">
        <label>Lãi suất kỳ vọng (Năm): <span id="valRate">8 %</span></label>
        <input type="range" id="inputRate" min="1" max="20" step="0.5" value="8">
    </div>

    <div class="control-group">
        <label>Thời gian đầu tư (Năm): <span id="valYears">20 Năm</span></label>
        <input type="range" id="inputYears" min="1" max="40" step="1" value="20">
    </div>

    <!-- Hộp hiển thị kết quả -->
    <div class="result-box">
        <p style="margin-top:0;">Tổng tài sản cuối kỳ:</p>
        <h3 id="finalTotal">0 ₫</h3>
    </div>

    <!-- Nơi chứa biểu đồ Chart.js -->
    <div class="chart-container">
        <canvas id="myChart"></canvas>
    </div>
</div>

<script>
    // JS: Xử lý logic và vẽ biểu đồ
    
    // Lấy các thẻ HTML (DOM elements) để tương tác
    const inputPrincipal = document.getElementById('inputPrincipal');
    const inputMonthly = document.getElementById('inputMonthly');
    const inputRate = document.getElementById('inputRate');
    const inputYears = document.getElementById('inputYears');
    
    const valPrincipal = document.getElementById('valPrincipal');
    const valMonthly = document.getElementById('valMonthly');
    const valRate = document.getElementById('valRate');
    const valYears = document.getElementById('valYears');
    const finalTotal = document.getElementById('finalTotal');

    // Hàm định dạng số tiền thành chuỗi có dấu phẩy (VD: 1,000,000 ₫)
    function formatMoney(num) {
        return num.toLocaleString('vi-VN') + ' ₫';
    }

    // Biến lưu trữ biểu đồ
    let myChart;

    // Hàm tính toán và cập nhật lại toàn bộ giao diện
    function calculateAndUpdate() {
        // 1. Lấy giá trị từ các thanh trượt
        let P = parseFloat(inputPrincipal.value);
        let PMT = parseFloat(inputMonthly.value);
        let rateAnnually = parseFloat(inputRate.value);
        let years = parseInt(inputYears.value);

        // 2. Cập nhật nhãn text bên trên các thanh trượt
        valPrincipal.textContent = formatMoney(P);
        valMonthly.textContent = formatMoney(PMT);
        valRate.textContent = rateAnnually + ' %';
        valYears.textContent = years + ' Năm';

        // 3. Tính toán dữ liệu cho từng năm để vẽ biểu đồ
        let labels = []; // Trục X (Các năm)
        let dataPrincipal = []; // Trục Y - Lớp 1: Gốc ban đầu
        let dataContributions = []; // Trục Y - Lớp 2: Tiền góp thêm
        let dataInterest = []; // Trục Y - Lớp 3: Lãi kép sinh ra

        let currentBalance = P;
        let totalContributions = 0;
        let monthlyRate = rateAnnually / 100 / 12; // Lãi suất theo tháng

        for (let y = 0; y <= years; y++) {
            labels.push('Năm ' + y);
            
            if (y === 0) {
                // Năm 0: Chỉ có vốn gốc
                dataPrincipal.push(P);
                dataContributions.push(0);
                dataInterest.push(0);
            } else {
                // Tính lãi cộng dồn cho 12 tháng của năm hiện tại
                for (let m = 1; m <= 12; m++) {
                    currentBalance = (currentBalance + PMT) * (1 + monthlyRate);
                    totalContributions += PMT;
                }
                
                // Tách các thành phần
                let totalInterest = currentBalance - P - totalContributions;
                
                dataPrincipal.push(P);
                dataContributions.push(totalContributions);
                dataInterest.push(totalInterest > 0 ? totalInterest : 0);
            }
        }

        // Cập nhật tổng số tiền hiển thị nổi bật
        finalTotal.textContent = formatMoney(currentBalance);

        // 4. Vẽ hoặc cập nhật biểu đồ
        updateChart(labels, dataPrincipal, dataContributions, dataInterest);
    }

    // Hàm quản lý biểu đồ Chart.js
    function updateChart(labels, dataPrincipal, dataContributions, dataInterest) {
        const ctx = document.getElementById('myChart').getContext('2d');
        
        // Nếu biểu đồ đã tồn tại, phá hủy nó trước khi vẽ cái mới (để tránh lỗi đè hình)
        if (myChart) {
            myChart.destroy();
        }

        // Khởi tạo biểu đồ miền xếp chồng (Stacked Area Chart)
        myChart = new Chart(ctx, {
            type: 'line',
            data: {
                labels: labels,
                datasets: [
                    {
                        label: 'Vốn ban đầu',
                        data: dataPrincipal,
                        borderColor: '#3498db',
                        backgroundColor: 'rgba(52, 152, 219, 0.5)',
                        fill: true,
                        stack: 'combined' // Gom nhóm xếp chồng
                    },
                    {
                        label: 'Vốn góp thêm',
                        data: dataContributions,
                        borderColor: '#9b59b6',
                        backgroundColor: 'rgba(155, 89, 182, 0.5)',
                        fill: true,
                        stack: 'combined'
                    },
                    {
                        label: 'Tiền lãi kép',
                        data: dataInterest,
                        borderColor: '#2ecc71',
                        backgroundColor: 'rgba(46, 204, 113, 0.5)',
                        fill: true,
                        stack: 'combined'
                    }
                ]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                    tooltip: {
                        mode: 'index',
                        intersect: false
                    }
                },
                scales: {
                    y: {
                        stacked: true, // Bật chế độ xếp chồng
                        ticks: {
                            // Rút gọn các số dài thành dạng Triệu/Tỷ cho dễ đọc
                            callback: function(value) {
                                if (value >= 1000000000) return (value / 1000000000).toFixed(1) + ' Tỷ';
                                if (value >= 1000000) return (value / 1000000).toFixed(0) + ' Tr';
                                return value;
                            }
                        }
                    }
                }
            }
        });
    }

    // 5. Gắn sự kiện (Event Listeners)
    // Khi người dùng kéo bất kỳ thanh trượt nào, gọi lại hàm tính toán
    inputPrincipal.addEventListener('input', calculateAndUpdate);
    inputMonthly.addEventListener('input', calculateAndUpdate);
    inputRate.addEventListener('input', calculateAndUpdate);
    inputYears.addEventListener('input', calculateAndUpdate);

    // Chạy tính toán lần đầu tiên ngay khi mở web
    calculateAndUpdate();

</script>
</body>
</html>
